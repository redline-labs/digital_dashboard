# nodes/map_match: which road we are on, and what is ahead.
#
#   ./build/nodes/map_match/map_match --config configs/map_match.yaml --check
#   ./build/nodes/map_match/map_match --config configs/map_match.yaml
#
# --check opens the graph, says what is in it and probes a query, without
# touching zenoh -- the fastest way to find out whether the path is right.

# Built by tools/map_build:
#
#   ./build/tools/map_build/map_build graph \
#       --input /Users/ryan/Documents/map_data/socal-260813.osm.pbf \
#       --output /Users/ryan/Documents/map_data/socal.graph
#
# Opened directly rather than through map_server: a matcher makes dozens of
# lookups per fix at 10 Hz, and a read-only mmap is shareable, so both processes
# hold the same file with no coordination.
graph: /Users/ryan/Documents/map_data/socal.graph

position:
  # Three GSOF record topics from nodes/bd992_bridge. The position record is the
  # trigger -- a fix is matched when one arrives -- and the other two are held
  # as latest-known and used only if they arrived recently enough to describe
  # the same moment.
  #
  # ALL THREE MUST COME FROM THE SAME PUBLISHER. Two bridges on one prefix
  # would interleave.
  position_key: nodes/bd992/gsof/lat_long_height
  velocity_key: nodes/bd992/gsof/velocity
  sigma_key: nodes/bd992/gsof/position_sigma

  # How recently a velocity or accuracy record must have arrived to be paired
  # with a position.
  #
  # This is NOT tied to the receiver's output rates, and deliberately so. The
  # records a receiver sends together arrive microseconds apart, so they pair
  # whether the shared rate is 1 Hz or 50 Hz; records on a slower schedule pair
  # while they are fresh and are reported absent when they are not. That means
  # changing what the receiver emits, or how often, does not require changing
  # anything here.
  #
  # Set it by how long a heading stays true, not by a rate. A vehicle turning at
  # 10 deg/s moves 2 degrees in 200 ms, which is inside the matcher's tolerance;
  # a full second would not be. When it is exceeded the matcher falls back on
  # distance alone rather than steering by a stale heading, and
  # nodes/map_match/status counts how often -- which is how a receiver
  # reconfiguration becomes visible instead of silently degrading the match.
  pair_within_ms: 200

  # A gap longer than this drops the candidate beam. Carrying it across would
  # explain a jump across town as a very long detour, and the matcher would be
  # confidently wrong until it recovered.
  stale_after_ms: 3000

match:
  search_radius_m: 50.0
  beam_width: 6

  # The emission width comes from the RECEIVER and is clamped into this range.
  #
  # The floor is a statement about the MAP's accuracy rather than the
  # receiver's: OSM centrelines are metres from the real road, so believing a
  # 2 cm RTK fix completely would make every candidate impossible and match
  # nothing at all. The ceiling stops a receiver that has lost its corrections
  # from making every road equally likely.
  min_sigma_m: 4.0
  max_sigma_m: 30.0
  default_sigma_m: 8.0

  transition_beta_m: 15.0

  # Below this speed a course over ground is noise -- a stationary vehicle's
  # heading wanders through all 360 degrees, and using it would re-match the car
  # onto a different road every fix while it sits at a light.
  heading_valid_above_mps: 1.5

  lookahead_m: 2000

services:
  horizon_key: nodes/map_match/horizon
  status_key: nodes/map_match/status
  horizon_interval_ms: 100
  status_interval_ms: 5000
