# The web console: reflash, system info, node health and service calls, served
# from the board.
#
# Shipped to /opt/redline/configs/web_console/web_console.yaml. The unit passes
# it with --config; running the node without one uses the defaults in
# node_config.h, which bind to loopback.

# LISTENS ON EVERY INTERFACE. The code's default is 127.0.0.1 so that a
# developer running this on a laptop is not exposed by accident; a board that
# ships the console is meant to be reachable from the bench, so it is widened
# here rather than in the code.
#
# This is not, by itself, an access control -- token_file below is. The two are
# meant to be read together: widening the bind address is only safe because the
# node refuses to serve /api/ without a token. Still open, and deliberately so
# while this is a bring-up image: TLS, a non-root service user, and a firewall.
bind_address: 0.0.0.0

port: 8080

# Empty means core::paths::resource("web"), which finds the assets next to the
# executable on the image and in the checkout on a workstation. Point it at
# /data/web somewhere writable to iterate on the frontend without rebuilding
# the image.
asset_dir: ""

# One line, mode 0600, on the writable partition -- credentials do not belong in
# a read-only rootfs. The unit generates it from /dev/urandom on first boot, so
# it is per board rather than baked into the image; read it with
#   cat /data/web_console/token
#
# FAIL CLOSED: if this names a file that is missing, unreadable or empty, the
# node REFUSES TO START rather than serving unauthenticated -- this config binds
# every interface and offers a reflash endpoint, and a console that is believed
# to be protected and is not is worse than one nobody trusts. To run without
# authentication, say so deliberately with an empty value here.
token_file: "${REDLINE_DATA_DIR}/web_console/token"

# Where uploaded RAUC bundles are staged before installing. /data is the only
# writable filesystem on the image.
upload_dir: "${REDLINE_DATA_DIR}/updates"

# Which bus RAUC is on. Always "system" on a board. "session" exists so the
# reflash path can be developed against tools/rauc_stub on a workstation, and
# setting it here would mean the console never finds RAUC at all.
rauc_bus: system
