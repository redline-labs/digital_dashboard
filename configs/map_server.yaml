# nodes/map_server: offline maps on the bus.
#
#   ./build/nodes/map_server/map_server --config configs/map_server.yaml --check
#   ./build/nodes/map_server/map_server --config configs/map_server.yaml
#
# --check opens every archive and says what is in it without touching zenoh,
# which is the fastest way to find out whether a path is right.

tilesets:
  # The name is what clients ask for and what appears in a tile URL; the path
  # is nobody's business but this node's. Renaming the file changes one line
  # here and nothing in any style or layout.
  - name: socal
    path: /Users/ryan/Documents/map_data/socal.mbtiles

  # The race-track layer, built by a verb that never opens a PBF:
  #
  #   ./build/tools/map_build/map_build tracks \
  #       --input /Users/ryan/Documents/map_data/tracks \
  #       --output /Users/ryan/Documents/map_data/tracks.mbtiles \
  #       --report /tmp/tracks_qa.csv
  #
  # A SEPARATE ARCHIVE, and that is the whole point: new track maps arrive on
  # their own schedule from their own source, and rebuilding them must not mean
  # rebuilding a 383 MB basemap -- nor the reverse. It is also global where the
  # basemap is regional, which is only affordable because 994 circuits are 4 MB
  # of tiles.
  #
  # The dashboard asks for it as an OVERLAY alongside the basemap; see
  # `overlay_tilesets` in configs/dashboard/map_demo.yaml.
  - name: tracks
    path: /Users/ryan/Documents/map_data/tracks.mbtiles

# The routable road network, built by tools/map_build:
#
#   ./build/tools/map_build/map_build graph \
#       --input /Users/ryan/Documents/map_data/socal-260813.osm.pbf \
#       --output /Users/ryan/Documents/map_data/socal.graph
#
# Named, not pathed, exactly as a tileset is. Absent is fine: without one the
# nearest/route services answer noSuchGraph and the tiles are unaffected.
graphs:
  - name: socal
    path: /Users/ryan/Documents/map_data/socal.graph

# The race-track CATALOGUE, which lives in extra tables inside the same file the
# `tracks` tileset above draws from.
#
# THE SAME PATH APPEARS TWICE ON PURPOSE. mbtiles::Archive reads the tiles and
# track_store::Store reads the catalogue; they are different libraries answering
# different questions, and either half can be present without the other -- an
# ordinary basemap has no catalogue at all. Two read-only SQLite connections to
# one file is fine. Do not "tidy" this into one entry.
#
# What the catalogue carries that the tiles cannot: the full-resolution outline,
# a centreline with a distance along it, and the start/finish gate. Tiling
# simplifies and clips, so none of those survive it.
tracksets:
  - name: tracks
    path: /Users/ryan/Documents/map_data/tracks.mbtiles

services:
  tile_key: map/tile
  catalog_key: map/catalog
  asset_key: map/asset
  status_key: map/status
  nearest_key: map/nearest
  route_key: map/route
  graph_info_key: map/graph
  track_catalog_key: map/track_catalog
  track_detail_key: map/track_detail
  status_interval_ms: 5000

# assets:
#   The asset service is off, and nothing needs it today. It exists to serve
#   files beside the tiles -- icons, an overlay, anything a future widget wants
#   -- and the dashboard's renderer does not: it draws with QPainter, so labels
#   use system fonts and there are no glyph ranges or sprite sheets to fetch.
#
#   root: /some/directory
#   max_bytes: 8388608
