# nodes/backlight: the primary display module's backlight and sensors.
#
#   ./build/nodes/backlight/backlight --config configs/backlight/backlight.yaml
#
# On the target this runs as redline-node@backlight, with
# /opt/redline/nodes/backlight.args holding REDLINE_NODE_ARGS=--config <this file>.
# With no display module in the slot there is no record, and the node says so
# and exits cleanly. See docs/nodes/backlight.md.

# Which display: names the record redline-display-setup writes per boot.
role: primary

# Where those records are. Point this at a fake tree to run off the target.
record_dir: /run/redline/displays

# Publishes <prefix>/status and serves <prefix>/set_brightness.
# Omit for nodes/backlight/<role>.
# topic_prefix: nodes/backlight/primary

# How often the backlight is read. Status is published when something moves
# (any backlight change, lux by 5 %, a temperature by 0.5 C) and every 2 s
# regardless. Lux is read every second and temperatures every 5 s.
poll_ms: 500

# Seconds, written to each light sensor's in_illuminance_integration_time at
# start; 0 leaves the driver's own. An opt3001 blocks a read for the whole
# conversion, so its 0.8 s default makes each read take about a second.
light_integration_time: 0.1

# The lowest brightness set_brightness will apply, percent of max_brightness.
min_percent: 1
