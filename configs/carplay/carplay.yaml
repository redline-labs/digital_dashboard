#
# CarPlay driver node configuration.
#
#     ./build/nodes/carplay/carplay --config configs/carplay/carplay.yaml
#
# Everything here has a working default, so the node runs without this file --
# but the defaults describe a generic development rig, not a vehicle. What is
# *not* here is deliberate: protocol constants (feature bitfields, audio format
# masks, sourceVersion, the resource arbitration table) stay in code, because
# they are negotiated behaviour rather than vehicle configuration and a wrong
# value there ends the session rather than looking wrong.

# Who the vehicle says it is.
#
# This reaches the phone by two different routes -- iAP2 identification during
# bring-up, and the AirPlay GET /info afterwards -- and the phone records some
# of it against the pairing. Change it before pairing a phone you care about,
# or that phone remembers the old identity.
vehicle:
  # `name` is also signed over in both pairing handshakes.
  name: "Dashboard"
  model: "MercedesDashboard1,1"
  manufacturer: "Dashboard"
  serial_number: "0123456"
  firmware_version: "1.0.0"
  hardware_version: "1.0"

  # Which side the driver sits on. CarPlay mirrors its own layout for this, so
  # it is worth setting rather than leaving at the default.
  right_hand_drive: false

  # gas | diesel | electric | cng
  engine_type: diesel

  # The language CarPlay speaks, and the ones it may offer. IETF tags.
  language: "en"
  supported_languages: ["en", "de"]

  # What the vehicle reports about itself while a session runs. CarPlay shows
  # range in the Maps trip planner and outside temperature in the status area.
  #
  # Every field is optional and nothing is invented -- an unset field is left
  # out of the update. If ALL of them are unset the capability is not advertised
  # at all, because the phone subscribes to it on every session and declaring it
  # without answering is a promise broken every time.
  #
  # Static values for now; the shape is the one a live vehicle-state source
  # would fill, so wiring it to real signals later changes only where the
  # numbers come from.
  status:
    range_km: 420
    outside_temperature_c: 21
    range_warning: false

# The panel CarPlay draws on.
display:
  width_px: 800
  height_px: 600
  fps: 30

  # Physical width in millimetres; the height follows from the pixel aspect
  # ratio. CarPlay sizes text and touch targets from this, so a wrong value
  # gives a UI that is legible on a desk and not at arm's length in a car.
  physical_width_mm: 200

  # Which input CarPlay lays its own UI out for: "touch" or "knob". A
  # knob-primary UI gets focus rings and list navigation instead of a
  # touch-first layout. The touchscreen, rotary controller, media keys and
  # telephony keypad are all advertised either way; this only says which one to
  # design for.
  primary_input: touch

  # Offer H.265 as well as H.264 and let the phone choose. The decode path
  # handles either, so this is only an advertisement -- but H.264 is the path
  # with every hardware session behind it, and turning this on hands the choice
  # to the phone, which will take it. Both halves go out together: hevcInfo in
  # GET /info and "hevc" in the SETUP enabledFeatures.
  allow_hevc: true

# Advertised as deviceID and as the Bluetooth address in GET /info. Locally
# administered (the 0x02 bit), which is what an accessory with no real MAC
# should present. Give each unit its own if you run more than one.
device_id: "02:00:00:00:00:01"

# Draw CarPlay's own UI in its night theme. Pushed to the phone at RECORD, and
# re-sent on every session -- the phone does not remember ours, and assumes day.
# There is no light sensor wired up yet, so this is a static setting.
night_mode: false

# The "manufacturer button": the tile CarPlay draws on its own home screen so
# the user can hand the screen back to the vehicle's UI. It is advertised to the
# phone once, in GET /info, which means changes here only take effect on the
# next session -- there is no way to show or hide it mid-session.
oem_button:
  # False leaves the keys out of GET /info entirely, and CarPlay shows no tile.
  enabled: true

  # Caption under the icon. CarPlay truncates past roughly 13 characters.
  label: "Dashboard"

  # Artwork, one entry per rendition; CarPlay picks whichever suits the phone's
  # scale factor. Paths are relative to this file. Dimensions are read from each
  # PNG, so only the path (and optionally `prerendered`) belongs here.
  #
  # `prerendered` defaults to true and should stay that way. Despite the name,
  # false does not merely ask CarPlay to apply its own corner mask -- it renders
  # an empty tile, label and all, with no artwork. Verified both ways against
  # iPhone17,1 / AirPlay 950.7.1 on 2026-08-02.
  icons:
    - path: oem_icon_60.png
    - path: oem_icon_120.png
    - path: oem_icon_180.png
