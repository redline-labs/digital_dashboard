# Vehicle state estimator: the MTi-610 and the BD992 fused into position,
# attitude, velocity, acceleration and sideslip.
#
# `state_estimator --check --config <this file>` validates it.
#
# EVERY NUMBER UNDER `vehicle:` BECOMES A SIDESLIP ERROR IF IT IS WRONG, and a
# wrong sideslip angle looks exactly like a right one. Measure them. The IMU's
# mounting, the lever arm and the antenna boresight are PRIORS: refined while
# driving, and what was learned is kept between sessions (`calibration:`
# below), so a centimetre or a couple of degrees off is fine. The mounting's
# yaw is learned only on straights driven straight -- see the note there. The
# reference point is a definition and is never estimated: it must be right.

inputs:
  imu_prefix: nodes/mti610/mtdata2   # needs delta_q and delta_v enabled
  gnss_prefix: nodes/bd992/gsof      # needs 1, 2, 8, 12, 27, 38

outputs:
  state_key: nodes/state_estimator/state
  status_key: nodes/state_estimator/status
  state_decimation: 1                # 1: every IMU sample (100 Hz)

vehicle:
  # The IMU's orientation in the body frame (x forward, y right, z down), as
  # roll, pitch, yaw in degrees. An MTi mounted label-up with x forward is
  # its z axis up, i.e. a half turn about x.
  imu_to_body_rpy_deg: [180.0, 0.0, 0.0]
  # How sure that is, about the body x, y, z. Yaw is sideslip error one for
  # one; it is learned on straights, roll and pitch at stops.
  imu_to_body_sigma_deg: [2.0, 2.0, 2.0]
  # Where to report: the CG, or the rear axle. IMU frame, metres.
  reference_point_m: [0.0, 0.0, 0.0]
  # IMU origin to the primary antenna's phase centre, IMU frame, metres.
  lever_arm_m: [0.0, 0.0, 1.2]
  lever_arm_sigma_m: 0.02
  # IMU origin to the secondary antenna. Only its direction from the primary
  # matters: the nominal baseline the boresight is estimated around.
  antenna2_lever_arm_m: [-1.2, 0.0, 1.2]
  boresight_sigma_deg: 1.0

imu:
  # Which body frame the MTi expresses delta_v in. `end` follows the SDI
  # equations in Xsens' reference manual; NOT YET CONFIRMED ON A DEVICE.
  dv_frame: end
  gyro_noise_density_dps: 0.007      # MTi-610 datasheet
  accel_noise_density_mps2: 0.00059  # 60 ug/sqrt(Hz)
  gyro_bias_walk: 2.0e-5             # rad/s/sqrt(s)
  accel_bias_walk: 2.0e-4            # m/s^2/sqrt(s)
  # GNSS latency floor minus IMU latency floor. Arrival-time alignment cannot
  # see it; until the two are wired to a common PPS, calibrate it here.
  time_offset_s: 0.0

gnss:
  burst_ms: 15
  velocity_sigma_horizontal: 0.03
  velocity_sigma_vertical: 0.06
  default_sigma_horizontal: 2.0      # used when no fresh GSOF 12
  default_sigma_vertical: 4.0

smoother:
  lag_s: 3.0
  max_iterations: 8
  time_budget_ms: 40

output:
  sideslip_min_speed: 2.0

# What was learned about the installation, kept between sessions.
#
# One row per group (mounting, lever_arm, boresight) each time the estimate
# has moved by more than move_threshold_sigma, or its sigma halved, and at most
# once per min_write_interval_s; once more at shutdown. Rows are never deleted:
#
#   sqlite3 <database> 'select datetime(written_at_ns/1e9, "unixepoch"),
#                              grp, reason, summary from calibration'
#
# A row applies only while the config's values for that group are the ones it
# was learned against (a hash of them is in the row); re-measure the lever arm
# and the lever-arm and boresight rows stop applying, the mounting's do not.
# Changing a sigma keeps them.
#
# The mounting's yaw is learned from the assumption that the car runs true on
# a straight: above 8 m/s, yaw rate under 1.5 deg/s and lateral acceleration
# under 0.5 m/s^2 for two seconds. A drift never qualifies. A car that crabs
# on straights (toe, a bent subframe) will teach it that crab.
calibration:
  enabled: true
  database: ${REDLINE_DATA_DIR}/state_estimator/calibration.sqlite
  min_write_interval_s: 900
  move_threshold_sigma: 1.0
  tighten_ratio: 0.5
  settle_s: 120             # after a (re)start, before anything is written
  load_inflation: 4.0       # a stored covariance times this is the next prior
  moved_sigma: 4.0          # this far from the stored value: health says "moved?"
  segment_s: 1.0
  mounting_walk_deg_per_sqrt_h: 0.05
  lever_arm_walk_mm_per_sqrt_h: 5.0
  boresight_walk_deg_per_sqrt_h: 0.05
