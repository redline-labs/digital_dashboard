name: "map"
width: 1000
height: 640
background_color: "#0d0f13"
widgets:
  # The offline map. Every tile comes from nodes/map_server over zenoh:
  #
  #   ./build/nodes/map_server/map_server --config configs/map_server.yaml
  #
  # Without that running the widget draws its background and says so, rather
  # than looking like an empty map.
  - type: map
    id: map
    x: 0
    y: 0
    width: 660
    height: 640
    config:
      tileset: "socal"
      # The race-track layer, drawn OVER the basemap from its own archive.
      #
      # A separate archive on purpose: new track maps arrive on their own
      # schedule and must not mean rebuilding a 383 MB basemap, nor the
      # reverse. It is global where socal is regional, which costs nothing --
      # 994 circuits are 4 MB of tiles. Built by `map_build tracks`.
      overlay_tilesets: ["tracks"]
      tile_zenoh_key: "map/tile"
      # The CAMERA's limits, not the archive's -- map_server reports what its
      # archive actually holds and the widget clamps its tile requests to that.
      # 17 lets the driver get about three levels closer than the socal
      # archive's z14, magnifying its deepest tiles.
      min_zoom: 0
      max_zoom: 17

      # Irvine, CA -- the archive covers Southern California, so anywhere else
      # is a legitimately empty map.
      center_latitude: 33.6865966
      center_longitude: -117.8557874
      zoom: 14.0

      # Drag to pan, wheel to zoom. A recentre button appears in the corner
      # once the camera has been moved off the vehicle.
      interactive: true

      follow_vehicle: true
      show_track: true
      track_points: 600

      # From nodes/bd992_bridge. Leave the key empty for a static map.
      #
      # The FUSED topic, not the per-record one: `<prefix>/epoch` carries the
      # position with the velocity, time and fix quality that arrived in the
      # same GSOF transmission. `<prefix>/gsof/lat_long_height` is still
      # published and would work here, but it carries a position and nothing
      # else -- and this key is the one anything that also wants heading or
      # accuracy should use. See schemas/gsof_epoch.capnp.
      position_zenoh_key: "nodes/bd992/epoch"
      position_schema_type: "GsofEpoch"
      latitude_expression: "latitudeDeg"
      longitude_expression: "longitudeDeg"

      # The road the matcher says we are on, lit up from the same horizon
      # topic road_info reads. Way ids only survive in tiles at z13+, so the
      # highlight quietly disappears on the zoomed-out map below.
      highlight_zenoh_key: "nodes/map_match/horizon"

      marker_color: "#FF3B30"
      marker_size: 9

  # The same map further out, to show the zoom levels behave. No vehicle on
  # this one, so it stays put.
  - type: map
    id: overview
    x: 670
    y: 0
    width: 330
    height: 320
    config:
      tileset: "socal"
      center_latitude: 33.6865966
      center_longitude: -117.8557874
      zoom: 9.0
      follow_vehicle: false
      position_zenoh_key: ""
      # Everything below is optional -- omitted keys keep the defaults in
      # dashboard/widgets/map/include/map/style.h. This one is tuned for a
      # small overview pane: no buildings, thinner text, and roads pulled back
      # so a region reads as a road network rather than a smear.
      style:
        show_buildings: false
        label_size: 10
        label_spacing: 10
        detail:
          road_minor: 13
          landuse: 10
        widths:
          motorway: 2.5
          motorway_casing: 3.75

  - type: static_text
    x: 670
    y: 336
    width: 330
    height: 40
    config:
      text: "socal  -  z14 / z9"
      font_size: 16
      color: "#8a919e"

  # What road we are on, from nodes/map_match. Reads the horizon topic
  # directly: the road name is text, and the generic expression binding yields
  # a double.
  - type: road_info
    id: road
    x: 8
    y: 8
    width: 380
    height: 76
    config:
      horizon_zenoh_key: "nodes/map_match/horizon"
      horizon_schema_type: "MapHorizon"
      show_confidence: true
      background_color: "#000000B0"
