windows:
  - name: instrument_cluster
    width: 1920
    height: 720
    background_color: "#000000"
    scale: none
    widgets:
      - x: 653
        y: 20
        width: 601
        height: 580
        type: mercedes_190e_speedometer
        config:
          odometer_value: 123456
          max_speed: 160
          zenoh_key: vehicle/speed_mps
          schema_type: VehicleSpeed
          speed_expression: mps_to_mph(speedMps)
          odometer_expression: totalMiles
          odometer_zenoh_key: vehicle/odometer
          odometer_schema_type: VehicleOdometer
          shift_box_markers:
            - 28
            - 54
            - 87
      - x: 1280
        y: 16
        width: 619
        height: 583
        type: mercedes_190e_tachometer
        config:
          max_rpm: 8000
          redline_rpm: 7000
          show_clock: true
          zenoh_key: vehicle/engine/rpm
          schema_type: EngineRpm
          rpm_expression: rpm
      - x: 38
        y: 662
        width: 30
        height: 30
        type: mercedes_190e_telltale
        config:
          telltale_type: battery
          warning_color: "#FF0000"
          normal_color: "#333333"
          zenoh_key: vehicle/telltales/battery_warning
          schema_type: BatteryWarning
          condition_expression: batteryVoltage < 12.0
      - x: 79
        y: 663
        width: 30
        height: 30
        type: mercedes_190e_telltale
        config:
          telltale_type: brake_system
          warning_color: "#FF0000"
          normal_color: "#333333"
          zenoh_key: vehicle/telltales/battery_warning
          schema_type: BatteryWarning
          condition_expression: batteryVoltage < 12.0
      - x: 120
        y: 663
        width: 30
        height: 30
        type: mercedes_190e_telltale
        config:
          telltale_type: high_beam
          warning_color: "#FF0000"
          normal_color: "#333333"
          zenoh_key: vehicle/telltales/battery_warning
          schema_type: BatteryWarning
          condition_expression: batteryVoltage < 12.0
      - x: 159
        y: 663
        width: 30
        height: 30
        type: mercedes_190e_telltale
        config:
          telltale_type: windshield_washer
          warning_color: "#FF0000"
          normal_color: "#333333"
          zenoh_key: vehicle/telltales/battery_warning
          schema_type: BatteryWarning
          condition_expression: batteryVoltage < 12.0
      - x: 20
        y: 11
        width: 613
        height: 589
        type: mercedes_190e_cluster_gauge
        config:
          fuel_gauge:
            min_value: 0
            max_value: 100
            zenoh_key: vehicle/speed_mps
            schema_type: VehicleSpeed
            value_expression: speedMps
          right_gauge:
            min_value: 0
            max_value: 3
            zenoh_key: vehicle/speed_mps
            schema_type: VehicleSpeed
            value_expression: psi_to_bar(speedMps)
          bottom_gauge:
            min_value: 0
            max_value: 80
            zenoh_key: vehicle/engine/temperature_celsius
            schema_type: EngineTemperature
            value_expression: temperatureCelsius
          left_gauge:
            min_value: 40
            max_value: 120
            zenoh_key: vehicle/engine/temperature_celsius
            schema_type: EngineTemperature
            value_expression: temperatureCelsius
          economy_sweep:
            label: ECONOMY
            red_start_fraction: 0.6
            outline_color: "#FFFFFF"
            red_color: "#C4281E"