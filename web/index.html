<!-- The board's web console.
     No bundler: a build step here would mean a third toolchain in the image's
     recipe, on top of the cross compiler and Emscripten. Hand-written ES
     modules and CSS until that stops being enough. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Redline console</title>
<link rel="stylesheet" href="style.css">

<header>
  <h1>Redline</h1>
  <span id="identity">&hellip;</span>
</header>

<nav>
  <button class="tab active" data-view="info">Info</button>
  <button class="tab" data-view="update">Update</button>
  <button class="tab" data-view="health" disabled title="Arrives with the wasm bus client">Health</button>
  <button class="tab" data-view="services" disabled title="Arrives with the wasm bus client">Services</button>
</nav>

<main id="update" hidden>
  <section>
    <h2>Running system</h2>
    <div id="update-status"></div>
  </section>

  <section>
    <h2>Install a bundle</h2>
    <p class="muted" id="staged"></p>
    <input type="file" id="bundle" accept=".raucb">
    <div class="actions">
      <button id="upload" disabled>Upload</button>
      <button id="install" disabled>Install</button>
      <button id="mark-good">Mark running slot good</button>
    </div>
    <div class="bar" id="progress-bar" hidden><span></span></div>
    <p class="muted" id="progress-text"></p>
    <p id="update-error" hidden></p>
  </section>

  <section>
    <h2>Slots</h2>
    <div id="slots"></div>
  </section>
</main>

<main id="info">
  <p id="error" hidden></p>

  <section>
    <h2>System</h2>
    <dl id="system"></dl>
  </section>

  <section>
    <h2>Storage</h2>
    <div id="storage"></div>
  </section>

  <section>
    <h2>Network</h2>
    <div id="network"></div>
  </section>

  <section>
    <h2>Temperatures</h2>
    <div id="temperatures"></div>
  </section>
</main>

<script type="module" src="app.js"></script>
