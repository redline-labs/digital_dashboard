[project]
name = "csym-oracle"
version = "0.1.0"
description = "SymForce reference vectors for libs/csym's oracle test. Never a build dependency."
requires-python = ">=3.12,<3.13"
dependencies = [
    # Pinned exactly: the vectors under libs/csym/tests/vectors, and the op
    # counts beside them, are SymForce 0.12's answers. A different release can
    # simplify differently and move every op count without csym changing.
    "symforce==0.12.0",
    "numpy>=2,<3",
]

[tool.uv]
package = false
