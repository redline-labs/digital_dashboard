[project]
name = "redline-mcp"
version = "0.1.0"
description = "MCP server for driving the Redline dashboard and editor headlessly"
requires-python = ">=3.11"
dependencies = [
    # 2.x renamed FastMCP to MCPServer (mcp.server.mcpserver); the decorator
    # surface is otherwise the same. Pinned to the major version because that
    # rename would break the import silently on a downgrade.
    "mcp>=2.0.0,<3",
]

[project.scripts]
redline-mcp = "redline_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/redline_mcp"]
